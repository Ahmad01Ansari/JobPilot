name: Cross-Platform Pre-Flight Verification

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  verify:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate 1 - Cross-Module Compilation
        run: |
          python -m py_compile runAiBot.py run_desktop.py app.py

      - name: Gate 2 - Core Unit & Contract Tests
        run: |
          python -m unittest tests/test_os_compatibility_and_lifecycle.py tests/test_platform_service.py tests/test_setup_service.py

      - name: Gate 3 - Headless Desktop GUI Verification
        run: |
          python run_desktop.py --offscreen --test-run
